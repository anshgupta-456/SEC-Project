# Render Blueprint: one Docker web service + a managed PostgreSQL database.
# In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: grievance-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grievance-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_ML_CLASSIFIER
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: grievance-hub-db
    plan: free
