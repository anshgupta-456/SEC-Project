# Full stack on one machine: MySQL + the app (API and frontend on port 8000).
#   cp .env.docker.example .env      # then set real secrets
#   docker compose up -d --build
#   docker compose exec app python manage.py create-admin
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grievance_management_system_db
      MYSQL_USER: grievance
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://grievance:${MYSQL_PASSWORD}@db/grievance_management_system_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENABLE_ML_CLASSIFIER: ${INSTALL_ML:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  db-data:
